# Nginx Reverse Proxy & Static Asset Server Configuration for VKShop
# Location: /etc/nginx/sites-available/vkshop

upstream vkshop_app {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name vkshop.local localhost; # Replace with your server domain or IP address

    # Increase maximum upload file size to 16MB
    client_max_body_size 16M;

    # Gzip Compression for fast page loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Serve static assets directly via Nginx (Bypasses Python/Gunicorn for ultra-fast performance)
    location /static/ {
        alias /var/www/vkshop/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Serve uploaded product media directly via Nginx
    location /static/uploads/ {
        alias /var/www/vkshop/static/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Reverse proxy HTTP requests to Gunicorn WSGI App Server
    location / {
        proxy_pass http://vkshop_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bounded proxy timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Custom Error Pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
