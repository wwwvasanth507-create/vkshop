events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging settings
    access_log  logs/nginx_access.log;
    error_log   logs/nginx_error.log info;

    # Rate Limiting configuration (10 requests per second limit per IP, burst of 20)
    limit_req_zone $binary_remote_addr zone=ecom_limit:10m rate=10r/s;

    # Upstream backend servers cluster (Round Robin with passive health checks)
    upstream ecom_servers {
        # Ubuntu Server 1 (Primary)
        server 192.168.10.11:5000 max_fails=3 fail_timeout=15s;
        # Ubuntu Server 2 (Secondary)
        server 192.168.10.12:5000 max_fails=3 fail_timeout=15s;
        # Windows Server 1
        server 192.168.10.21:5000 max_fails=3 fail_timeout=15s;
        # Windows Server 2
        server 192.168.10.22:5000 max_fails=3 fail_timeout=15s;
    }

    # 1. HTTP Server - Redirects all requests to HTTPS
    server {
        listen 80;
        server_name vkshop.com www.vkshop.com;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Server
    server {
        listen 443 ssl;
        server_name vkshop.com www.vkshop.com;

        # SSL Certificates (paths are templates - replace with actual paths on host)
        ssl_certificate      /etc/ssl/certs/vkshop.crt;
        ssl_certificate_key  /etc/ssl/certs/vkshop.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Max request body size (matches Flask MAX_CONTENT_LENGTH of 16MB)
        client_max_body_size 16M;

        # Application Route Proxying
        location / {
            # Apply Rate Limiting
            limit_req zone=ecom_limit burst=20 nodelay;

            proxy_pass http://ecom_servers;
            
            # Proxy headers setup (essential for secure cookies and CSRF checks)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Socket.IO support (WebSocket routing)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        # Health monitoring shortcut location bypasses rate limiting for checkers
        location /health {
            proxy_pass http://ecom_servers/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
