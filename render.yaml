services:
  - type: web
    name: vkshop
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vkshop-db
          property: connectionString
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET_NAME
        value: ecom-uploads
      - key: MINIO_SECURE
        value: "True"
      - key: ALLOW_LOCAL_STORAGE_FALLBACK
        value: "False"
      - key: IMAGE_MAX_WIDTH
        value: "1600"
      - key: IMAGE_MAX_HEIGHT
        value: "1600"
      - key: IMAGE_WEBP_QUALITY
        value: "82"
      - key: IMAGE_MAX_UPLOAD_MB
        value: "15"
      - key: SESSION_COOKIE_SECURE
        value: "True"

databases:
  - name: vkshop-db
    databaseName: ecommerce
    user: vkshop_user
    plan: free
