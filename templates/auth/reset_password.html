{% extends 'base.html' %}
{% block title %}Reset Password - VKshop{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-lg);">
    <h2 style="text-align: center; margin-bottom: 2rem; font-family: var(--font-heading);">Set New Password</h2>
    
    <form action="" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <!-- New Password -->
        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" required>
        </div>
        
        <!-- Confirm Password -->
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Reset Password</button>
    </form>
</div>
{% endblock %}
