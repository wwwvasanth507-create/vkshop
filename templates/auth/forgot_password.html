{% extends 'base.html' %}
{% block title %}Reset Password - VKshop{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-lg);">
    <h2 style="text-align: center; margin-bottom: 1rem; font-family: var(--font-heading);">Forgot Password</h2>
    <p style="color: var(--text-secondary); text-align: center; font-size: 0.9rem; margin-bottom: 2rem;">
        Enter your registered email address below. We'll simulate sending you a secure password reset link.
    </p>
    
    <form action="{{ url_for('auth.forgot_password') }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Get Demo Reset Link</button>
    </form>
    
    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        Remember your password? <a href="{{ url_for('auth.login') }}" style="font-weight: 600;">Sign In</a>
    </div>
</div>
{% endblock %}
