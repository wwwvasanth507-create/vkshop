{% extends 'base.html' %}
{% block title %}Internal Server Error - VKshop{% endblock %}

{% block content %}
<div style="text-align: center; padding: 5rem 2rem; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); max-width: 600px; margin: 3rem auto; box-shadow: var(--shadow-sm);">
    <i class="fa-solid fa-triangle-exclamation" style="font-size: 5rem; color: var(--danger); margin-bottom: 1.5rem;"></i>
    <h1 style="font-family: var(--font-heading); margin-bottom: 0.5rem; font-size: 2.25rem;">Internal Error</h1>
    <p style="color: var(--text-secondary); margin-bottom: 2.5rem; font-size: 1.1rem; line-height: 1.5;">
        Oops! Something went wrong on our end. This issue has been logged, and our engineering team has been notified.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">Go to Homepage</a>
        <a href="{% if current_user.is_authenticated %}{{ url_for('customer.dashboard') }}#tickets{% else %}{{ url_for('auth.login') }}{% endif %}" class="btn btn-secondary"><i class="fa-solid fa-headset"></i> Contact Support</a>
    </div>
</div>
{% endblock %}
